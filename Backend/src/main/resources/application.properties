spring.application.name=Backend

#initialization
# Copy this file, rename to application.properties
# and fill your own Supabase credentials

spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0&tcpKeepAlive=true
spring.datasource.username=postgres.dejaomcdgfnqnkhucjfi
spring.datasource.password=${DB_PASSWORD:YOUR_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000

# Hibernate schema management
# We use validate to ensure our Java entities match the Supabase schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Set port to 8081 to avoid conflict with other apps
server.port=8081

# ============================================
# Email (SMTP) - for payment receipts & notifications
# Works with Gmail (use an App Password), SendGrid, Mailtrap, etc.
# ============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:ghpwiml@gmail.com}
spring.mail.password=${MAIL_PASSWORD:YOUR_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:ghpwiml@gmail.com}
app.mail.from-name=Sri Lanka Traffic Fine System

# ============================================
# JWT
# ============================================
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS_LONG_0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ============================================
# Twilio SMS - for officer payment notifications
# ============================================
app.twilio.enabled=true
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:YOUR_TWILIO_SID}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:YOUR_TWILIO_TOKEN}
app.twilio.phone-number=${TWILIO_PHONE_NUMBER:+15173542575}